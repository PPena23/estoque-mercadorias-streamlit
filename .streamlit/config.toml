[theme]
base = "light"
primaryColor = "#1F6F50"
backgroundColor = "#FBF8F3"
secondaryBackgroundColor = "#F3EDE3"
textColor = "#2B2420"
linkColor = "#1F6F50"
borderColor = "#E7DFD2"
dataframeHeaderBackgroundColor = "#F3EDE3"
redColor = "#C2502A"
orangeColor = "#D9663A"
greenColor = "#1F6F50"
font = "DM Sans:https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400&display=swap, sans-serif"
headingFont = "Fraunces:https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&display=swap, serif"
headingFontWeights = [600, 600, 600, 600, 600, 600]
baseRadius = "0.85rem"
buttonRadius = "full"
showWidgetBorder = true
chartCategoricalColors = ["#1F6F50", "#D9663A", "#C98A1B", "#5B8C85", "#8C5E3C", "#A7C4A0", "#C9A27E", "#3E4E50"]

[browser]
gatherUsageStats = false

[server]
runOnSave = false
